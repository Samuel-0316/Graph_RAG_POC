# ============================================================
# Neo4j Graph Database — Local Development
# ============================================================
# Start:  docker-compose up -d
# Stop:   docker-compose down
# Browse: http://localhost:7474  (Neo4j Browser)
# Bolt:   bolt://localhost:7687  (Python driver connects here)
# ============================================================

version: '3.8'
services:
  neo4j:
    image: neo4j:5.18-community
    container_name: competitive-intel-neo4j
    ports:
      - '7474:7474'   # Neo4j Browser (web UI)
      - '7687:7687'   # Bolt protocol (Python driver)
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
